name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build application image
        run: docker build --tag cinesenac:ci .

      - name: Run pytest with coverage
        run: python -m coverage run -m pytest -q

      - name: Run BDD scenarios with coverage
        run: python -m coverage run --append -m behave

      - name: Generate coverage reports
        run: |
          mkdir -p reports
          python -m coverage report --show-missing
          printf '# Relatório de cobertura\n\n' > reports/coverage-report.md
          printf 'Cobertura de linhas e branches da aplicação medida em conjunto para pytest e BDD. Os 11 cenários funcionais existentes estão representados pelos 11 cenários Gherkin.\n\n' >> reports/coverage-report.md
          python -m coverage report --format=markdown >> reports/coverage-report.md
          python -m coverage html --directory coverage_html
          python -m coverage xml -o coverage.xml

      - name: Test container with Testcontainers
        env:
          RUN_CONTAINER_TESTS: "1"
        run: python -m pytest -q tests/test_container.py

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            reports/coverage-report.md
            coverage_html/
            coverage.xml
          if-no-files-found: warn
